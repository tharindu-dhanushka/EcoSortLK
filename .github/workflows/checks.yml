name: Feature checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/eco-tips, feature/sorting-journal]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test tests/*.test.cjs
